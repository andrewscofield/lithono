<article class="stack auth-panel">
  <h1>Create an account</h1>
  <p>Already registered? <a href="${loginHref}">Sign in</a>.</p>
  <form class="stack" method="post" action="${signUpHref}">
    <p class="notice" data-form-error hidden="${!actions.signUp.error}">${actions.signUp.error ?? ''}</p>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" value="${actions.signUp.values.name ?? ''}">
      <p class="field__error" data-error-for="name" hidden="${!actions.signUp.issue('name')}">${actions.signUp.issue('name') ?? ''}</p>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="${actions.signUp.values.email ?? ''}">
      <p class="field__error" data-error-for="email" hidden="${!actions.signUp.issue('email')}">${actions.signUp.issue('email') ?? ''}</p>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" value="${actions.signUp.values.password ?? ''}">
      <p class="field__error" data-error-for="password" hidden="${!actions.signUp.issue('password')}">${actions.signUp.issue('password') ?? ''}</p>
    </div>
    <button class="btn" type="submit">Create account</button>
  </form>
</article>
