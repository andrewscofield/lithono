name: Alpha verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:types
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:node
      - run: pnpm test:showcase
      - run: pnpm test:docs
      - run: pnpm build
      - run: pnpm test:browser
      - run: pnpm test:demos:production
      - run: pnpm test:docs:site
      - run: pnpm test:package
      - run: pnpm test:docs:checkpoints
      - run: pnpm test:tailwind
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-node-${{ matrix.node }}
          path: |
            tests/**/results/
            test-results/
